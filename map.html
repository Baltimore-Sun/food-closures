<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Baltimore Food Establishment Closures</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap">

<style>
  /* ---------------------------------------------------------------
     Accent color lives here as a single custom property -- change
     this one line to re-theme the whole page.
  --------------------------------------------------------------- */
  :root {
    --accent: #1c2551;
    --accent-soft: rgba(28, 37, 81, 0.18);
  }

  html, body, #map {
    height: 100%;
    margin: 0;
    padding: 0;
  }
  body {
    font-family: 'Noto Sans', sans-serif;
    overflow: hidden;
  }
  #map {
    width: 100%;
    background: #eef1f4;
  }

  #status-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #eef1f4;
    color: #6b7280;
    font-size: 14px;
    z-index: 1000;
    padding: 24px;
    text-align: center;
    box-sizing: border-box;
  }
  #status-overlay.hidden { display: none; }

  /* Solid-dot marker (custom divIcon; visual is small, but the icon's
     own box is 44x44 so the tap/click target stays touch-friendly) */
  /* NOTE: no "position" here on purpose. Leaflet positions every marker
     with position:absolute + a transform; overriding that (e.g. with
     position:relative) makes markers stack in normal flow and drift
     away from their true coordinates. Leaflet's absolute positioning
     already serves as the containing block for the .cd-dot child. */
  .cd-marker { width: 44px; height: 44px; }
  .cd-marker .cd-dot {
    position: absolute; top: 50%; left: 50%;
    width: 16px; height: 16px; margin: -8px 0 0 -8px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #ffffff;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.15);
  }

  /* Popup chrome -- "Minimal Card" style approved in the mockup */
  .leaflet-popup-content-wrapper {
    border-radius: 10px;
    box-shadow: 0 4px 14px rgba(20, 20, 35, 0.10);
    border: 1px solid #e3e5ea;
    padding: 0;
  }
  .leaflet-popup-content {
    margin: 16px 18px 18px 18px;
    font-family: 'Noto Sans', sans-serif;
    line-height: normal;
  }
  .leaflet-popup-close-button {
    color: #9aa0ab !important;
  }
  .cd-name {
    font-size: 16px;
    font-weight: 700;
    color: #15162b;
    line-height: 1.25;
  }
  .cd-addr {
    font-size: 13px;
    color: #6b7280;
    margin-top: 2px;
    line-height: 1.3;
  }
  .cd-divider {
    height: 1px;
    background: #eceef1;
    margin: 12px 0;
  }
  .cd-field {
    font-size: 13px;
    line-height: 1.6;
    color: #33343d;
  }
  .cd-field + .cd-field {
    margin-top: 6px;
  }
  .cd-label {
    font-weight: 700;
    color: var(--accent);
  }

  /* Keep the popup usable down to a 320px-wide viewport */
  @media (max-width: 360px) {
    .leaflet-popup-content {
      margin: 14px 14px 16px 14px;
    }
    .cd-name { font-size: 15px; }
    .cd-addr, .cd-field { font-size: 12.5px; }
  }
</style>
</head>
<body>

<div id="map"></div>
<div id="status-overlay">Loading closures&hellip;</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

<script>
(function () {
  "use strict";

  // -----------------------------------------------------------------
  // Configuration -- the handful of things you're likely to tweak.
  // -----------------------------------------------------------------
  var CONFIG = {
    // Same-origin fetch: this file and the CSV are both served from
    // GitHub Pages, so no CORS concerns and the map always reflects
    // whatever the scraper last committed -- no rebuild needed.
    csvUrl: "data/closures.csv",

    // Your CARTO API key, from carto.com/basemaps/apikey.
    // NOTE: per CARTO's own current docs, the tile URL takes it as a
    // "key" query parameter (not "api_key" -- an easy mix-up, since
    // other providers use that name).
    cartoApiKey: "YOUR_CARTO_API_KEY_HERE",

    // Overlapping dots are spread apart in screen pixels at the current
    // zoom, recomputed after every zoom from the true coordinates.
    // Dots within this many pixels of a group's first dot join that
    // group. (A dot is 20px across including its white border.)
    jitterThresholdPx: 20,

    // Target gap, in pixels, between neighboring dots once spread.
    jitterSpacingPx: 22,

    // No dot is ever drawn farther than this from its true location.
    // Lower = dots stay closer to their real spots but overlap more;
    // higher = more separation at mid zooms.
    jitterMaxMeters: 100,

    // If the cap above works out to fewer pixels than this (zoomed far
    // out), spreading is skipped and dots sit at their true locations.
    jitterMinSpreadPx: 3,

    // Initial view: centered on the simple average of all points, at a
    // fixed, zoomed-out "whole city" level, rather than tightly fit to
    // whatever the current data's exact spread happens to be.
    defaultZoom: 11,

    // Fallback view if there's no geocoded data to fit bounds to.
    fallbackCenter: [39.2904, -76.6122],
    fallbackZoom: 12
  };

  var TILE_URL =
    "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png?key=" +
    encodeURIComponent(CONFIG.cartoApiKey);
  var TILE_ATTRIBUTION =
    '&copy; <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a>, ' +
    '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors';

  // -----------------------------------------------------------------
  // Small helpers
  // -----------------------------------------------------------------
  function escapeHtml(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // "6717 Reisterstown Rd., 21215" + "Fallstaff" -> "6717 Reisterstown Rd., Fallstaff"
  function addressWithNeighborhood(address, neighborhood) {
    address = address || "";
    if (!neighborhood) return address;
    var withNeighborhood = address.replace(/,\s*\d{5}(-\d{4})?\s*$/, ", " + neighborhood);
    // If the address didn't end in a recognizable ZIP, don't silently
    // drop information -- fall back to appending the neighborhood.
    return withNeighborhood !== address ? withNeighborhood : address + " (" + neighborhood + ")";
  }

  function buildPopupHtml(row) {
    var addr = addressWithNeighborhood(row["Address"], row["Neighborhood"]);
    return (
      '<div class="cd-name">' + escapeHtml(row["Establishment"]) + "</div>" +
      '<div class="cd-addr">' + escapeHtml(addr) + "</div>" +
      '<div class="cd-divider"></div>' +
      '<div class="cd-field"><span class="cd-label">Closure reason:</span> ' + escapeHtml(row["Closure reason"]) + "</div>" +
      '<div class="cd-field"><span class="cd-label">Closure date:</span> ' + escapeHtml(row["Closure date"]) + "</div>" +
      '<div class="cd-field"><span class="cd-label">Date approved to re-open:</span> ' + escapeHtml(row["Date approved to re-open"]) + "</div>"
    );
  }

  function solidDotIcon() {
    return L.divIcon({
      className: "cd-marker",
      html: '<div class="cd-dot"></div>',
      iconSize: [44, 44],
      iconAnchor: [22, 22],
      popupAnchor: [0, -14]
    });
  }

  // Pure pixel-space jitter. Takes unrounded screen positions
  // [{x, y}, ...] (in a stable order) and returns new positions in the
  // same order.
  //   - No chaining: each ungrouped dot starts a group and takes in only
  //     ungrouped dots within thresholdPx of IT, so a group can never
  //     extend more than thresholdPx from its first dot. (Chaining merged
  //     most of the city into a few giant rings when zoomed out.)
  //   - Groups of up to 6 go on a small circle with neighbors spacingPx
  //     apart; larger groups fill a compact "sunflower" disc instead.
  //   - Cap: no dot moves more than maxPx from its own true position;
  //     if a layout would, the whole group's layout shrinks
  //     proportionally (dots overlap rather than wander off).
  function jitterPixelPositions(positions, thresholdPx, spacingPx, maxPx) {
    var n = positions.length;
    var result = positions.map(function (p) { return { x: p.x, y: p.y }; });
    var taken = new Array(n).fill(false);
    var GOLDEN_ANGLE = 2.399963; // radians, ~137.5 degrees

    for (var i = 0; i < n; i++) {
      if (taken[i]) continue;
      var group = [i];
      taken[i] = true;
      for (var j = i + 1; j < n; j++) {
        if (taken[j]) continue;
        var dx = positions[i].x - positions[j].x;
        var dy = positions[i].y - positions[j].y;
        if (dx * dx + dy * dy < thresholdPx * thresholdPx) {
          group.push(j);
          taken[j] = true;
        }
      }
      var m = group.length;
      if (m === 1) continue;

      var cx = 0, cy = 0;
      group.forEach(function (idx) { cx += positions[idx].x; cy += positions[idx].y; });
      cx /= m;
      cy /= m;

      var spots = group.map(function (idx, slot) {
        if (m <= 6) {
          var r = spacingPx / (2 * Math.sin(Math.PI / m));
          var a = -Math.PI / 2 + (2 * Math.PI * slot) / m;
          return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
        }
        var rr = spacingPx * 0.66 * Math.sqrt(slot + 0.5);
        var t = slot * GOLDEN_ANGLE;
        return { x: cx + rr * Math.cos(t), y: cy + rr * Math.sin(t) };
      });

      var worst = 0;
      group.forEach(function (idx, slot) {
        worst = Math.max(worst, Math.hypot(spots[slot].x - positions[idx].x, spots[slot].y - positions[idx].y));
      });
      var f = worst > maxPx ? maxPx / worst : 1;

      group.forEach(function (idx, slot) {
        result[idx] = {
          x: positions[idx].x + (spots[slot].x - positions[idx].x) * f,
          y: positions[idx].y + (spots[slot].y - positions[idx].y) * f
        };
      });
    }

    return result;
  }

  // Moves each marker to its spread position for the map's current zoom.
  // Always starts from the true coordinates, so nothing drifts. Uses
  // map.project/unproject (unrounded) rather than latLngToLayerPoint,
  // whose whole-pixel rounding would break the distance cap. Entries
  // keep their load order, which serves as each dot's stable ID, so
  // dots keep their slots across zooms. An open popup follows its
  // marker automatically when the marker moves.
  function applyPixelJitter(map, entries) {
    var zoom = map.getZoom();
    var metersPerPx =
      (40075016.686 * Math.cos((map.getCenter().lat * Math.PI) / 180)) / (256 * Math.pow(2, zoom));
    var maxPx = CONFIG.jitterMaxMeters / metersPerPx;

    if (maxPx < CONFIG.jitterMinSpreadPx) {
      entries.forEach(function (e) { e.marker.setLatLng(e.trueLatLng); });
      return;
    }

    var projected = entries.map(function (e) { return map.project(e.trueLatLng, zoom); });
    var spread = jitterPixelPositions(projected, CONFIG.jitterThresholdPx, CONFIG.jitterSpacingPx, maxPx);
    entries.forEach(function (e, i) {
      e.marker.setLatLng(map.unproject(L.point(spread[i].x, spread[i].y), zoom));
    });
  }

  function showStatus(message) {
    var el = document.getElementById("status-overlay");
    el.textContent = message;
    el.classList.remove("hidden");
  }

  function hideStatus() {
    document.getElementById("status-overlay").classList.add("hidden");
  }

  // -----------------------------------------------------------------
  // Main
  // -----------------------------------------------------------------
  function init() {
    fetch(CONFIG.csvUrl, { cache: "no-store" })
      .then(function (resp) {
        if (!resp.ok) throw new Error("HTTP " + resp.status + " fetching " + CONFIG.csvUrl);
        return resp.text();
      })
      .then(function (csvText) {
        var parsed = Papa.parse(csvText, { header: true, skipEmptyLines: true });
        var rows = parsed.data || [];

        var points = [];
        rows.forEach(function (row) {
          var lat = parseFloat(row["Latitude"]);
          var lng = parseFloat(row["Longitude"]);
          if (isFinite(lat) && isFinite(lng)) {
            points.push({ lat: lat, lng: lng, row: row });
          }
        });

        var map = L.map("map", { zoomControl: true, tap: true });
        // Drop Leaflet's default attribution prefix (purely a design
        // choice) -- our own CARTO/OpenStreetMap attribution below is
        // unaffected and still required.
        map.attributionControl.setPrefix(false);

        L.tileLayer(TILE_URL, {
          attribution: TILE_ATTRIBUTION,
          subdomains: "abcd",
          maxZoom: 20,
          detectRetina: true
        }).addTo(map);

        if (points.length === 0) {
          map.setView(CONFIG.fallbackCenter, CONFIG.fallbackZoom);
          showStatus("No geocoded closures to display right now.");
          return;
        }

        // Set the view before placing markers: pixel-based jitter needs
        // a zoom level to project coordinates into screen space.
        // Center = simple, unweighted average of lat/lng -- close enough
        // for a sensible overview without extra geo math.
        var centerLat = points.reduce(function (sum, p) { return sum + p.lat; }, 0) / points.length;
        var centerLng = points.reduce(function (sum, p) { return sum + p.lng; }, 0) / points.length;
        map.setView([centerLat, centerLng], CONFIG.defaultZoom);

        var entries = points.map(function (p) {
          var trueLatLng = L.latLng(p.lat, p.lng);
          var marker = L.marker(trueLatLng, { icon: solidDotIcon() });
          marker.bindPopup(buildPopupHtml(p.row), {
            maxWidth: 280,
            minWidth: 200,
            autoPanPadding: [16, 16]
          });
          marker.addTo(map);
          return { marker: marker, trueLatLng: trueLatLng };
        });

        // Spread overlapping dots for the current zoom, and again after
        // every zoom change (dots that overlap when zoomed out usually
        // separate on their own when zoomed in, and vice versa).
        applyPixelJitter(map, entries);
        map.on("zoomend", function () {
          applyPixelJitter(map, entries);
        });

        hideStatus();
      })
      .catch(function (err) {
        console.error(err);
        showStatus("Could not load closures data. Please try again later.");
      });
  }

  document.addEventListener("DOMContentLoaded", init);
})();
</script>
</body>
</html>
