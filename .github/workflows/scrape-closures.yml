name: Scrape closures (to staging)

# Manual trigger only. Writes STAGING files for review:
#   data/staging/closures_review.yaml  <- review and edit this
#   data/staging/geocode_cache.json
#   data/staging/scrape_warnings.txt
# Does NOT change the live map or Datawrapper table. Run "Publish closures"
# for that. Note: this overwrites the review file, so publish any pending
# edits before scraping again.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "recent = rolling window; full = entire table"
        required: true
        type: choice
        options:
          - recent
          - full
        default: recent
      days:
        description: "Window size in days for mode=recent"
        required: true
        default: "14"

permissions:
  contents: write

# Scrape and publish both commit to the repo; never let them run at once.
concurrency:
  group: closures-data
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          ARCGIS_API_KEY: ${{ secrets.ARCGIS_API_KEY }}
        run: |
          python scrape_closures.py \
            --mode "${{ inputs.mode }}" \
            --days "${{ inputs.days }}" \
            --staging-dir data/staging \
            --verbose

      - name: Commit staging files if changed
        run: |
          git add data/staging
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Scrape to staging (mode=${{ inputs.mode }}, days=${{ inputs.days }})"
          # Pick up any commit made while this ran (e.g. a review edit).
          git pull --rebase
          git push
